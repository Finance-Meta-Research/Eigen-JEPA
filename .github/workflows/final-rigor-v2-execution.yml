name: Eigen-JEPA Final Rigor v2 Execution

on:
  pull_request:
    paths:
      - '.github/workflows/final-rigor-v2-execution.yml'
      - 'protocols/final_rigor_v2_20260905.json'
      - 'requirements/final_rigor_v2.txt'
      - 'eigen_jepa/benchmark.py'
      - 'eigen_jepa/train.py'
      - 'eigen_jepa/data.py'
      - 'eigen_jepa/utils.py'
      - 'scripts/check_final_rigor_v2.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eigen-final-rigor-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute-frozen-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/final_rigor_v2.txt

      - name: Verify frozen scientific source identities before outcome access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          protocol = json.loads(Path('protocols/final_rigor_v2_20260905.json').read_text())
          assert protocol['status'] == 'FROZEN_PRE_OUTCOME'
          assert protocol['seeds'] == [7, 19, 31, 43, 59]
          assert protocol['paper_facing_variants'] == ['full', 'no_memory', 'no_gate', 'no_regime']
          assert protocol['environment']['device'] == 'cpu'
          assert protocol['environment']['deterministic'] is True

          expected = {
              'eigen_jepa/benchmark.py': protocol['scientific_source']['benchmark_py_blob'],
              'eigen_jepa/train.py': protocol['scientific_source']['train_py_blob'],
              'eigen_jepa/data.py': protocol['scientific_source']['data_py_blob'],
              'eigen_jepa/utils.py': protocol['scientific_source']['utils_py_blob'],
              'scripts/check_rigor_gate.py': protocol['scientific_source']['rigor_gate_blob'],
          }
          for path, frozen_blob in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != frozen_blob:
                  raise SystemExit(f'frozen scientific source drift: {path}: {actual} != {frozen_blob}')
          print('FROZEN_SCIENTIFIC_SOURCE_IDENTITIES_PASS')
          PY

      - name: Install exact frozen environment dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/final_rigor_v2.txt
          python -m pip install --no-deps -e .

      - name: Record pre-outcome environment and source receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/final_rigor_v2
          {
            echo 'protocol=protocols/final_rigor_v2_20260905.json'
            echo "workflow_head_sha=${GITHUB_SHA}"
            git rev-parse HEAD
            git status --porcelain=v1
            git hash-object eigen_jepa/benchmark.py
            git hash-object eigen_jepa/train.py
            git hash-object eigen_jepa/data.py
            git hash-object eigen_jepa/utils.py
            python -VV
            python -m pip freeze
            python -c "import platform, numpy, torch, matplotlib; print(platform.platform()); print('numpy', numpy.__version__); print('torch', torch.__version__); print('matplotlib', matplotlib.__version__); print('cuda_available', torch.cuda.is_available()); print('threads', torch.get_num_threads(), torch.get_num_interop_threads())"
          } > results/final_rigor_v2/PRE_OUTCOME_ENVIRONMENT_RECEIPT.txt

      - name: Execute exact frozen five-seed four-variant protocol
        shell: bash
        run: |
          set -euo pipefail
          python -m eigen_jepa.benchmark \
            --deterministic \
            --device cpu \
            --seeds 7 19 31 43 59 \
            --variants full no_memory no_gate no_regime \
            --num_assets 12 \
            --total_steps 240 \
            --context_len 20 \
            --horizon 6 \
            --num_train 140 \
            --num_val 36 \
            --num_test 36 \
            --k 3 \
            --epochs 8 \
            --batch_size 16 \
            --lr 0.0008 \
            --wd 0.0001 \
            --d_model 64 \
            --n_heads 4 \
            --n_layers 2 \
            --dropout 0.10 \
            --latent_dim 64 \
            --memory_size 128 \
            --memory_top_k 4 \
            --memory_temperature 0.18 \
            --merge_radius 0.16 \
            --min_salience 0.20 \
            --market_style equity \
            --regime_weight 0.75 \
            --gate_weight 0.05 \
            --tail_boost 1.5 \
            --event_quantile 0.70 \
            --mask_ratio 0.25 \
            --block_time 4 \
            --data_source synthetic \
            --eig_weight 1.0 \
            --subspace_weight 2.0 \
            --drift_weight 0.5 \
            --risk_weight 0.25 \
            --entropy_weight 0.15 \
            --rank_weight 0.15 \
            --out_dir results/final_rigor_v2 \
            > results/final_rigor_v2/EXECUTION_STDOUT.json

      - name: Run exact frozen result verifier
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_final_rigor_v2.py \
            --metrics results/final_rigor_v2/metrics.json \
            | tee results/final_rigor_v2/VERIFICATION.txt

      - name: Hash retained evidence package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp protocols/final_rigor_v2_20260905.json results/final_rigor_v2/FROZEN_PROTOCOL.json
          find results/final_rigor_v2 -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > results/final_rigor_v2/EVIDENCE_SHA256SUMS.txt

      - name: Retain complete final-rigor evidence whether positive, null, adverse, or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eigen-jepa-final-rigor-v2-${{ github.sha }}
          path: results/final_rigor_v2/**
          retention-days: 90
          if-no-files-found: error
