name: Eigen-JEPA Final Rigor V2 Frozen Run

on:
  push:
    branches:
      - research/final-rigor-v2-run-20260905
    paths:
      - .github/workflows/final-rigor-v2-run.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eigen-jepa-final-rigor-v2-20260905
  cancel-in-progress: false

jobs:
  frozen-final-rigor-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: requirements/final_rigor_v2.txt

      - name: Verify pre-outcome protocol and scientific source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          p = json.loads(Path('protocols/final_rigor_v2_20260905.json').read_text())
          assert p['status'] == 'FROZEN_PRE_OUTCOME'
          assert p['seeds'] == [7, 19, 31, 43, 59]
          assert p['paper_facing_variants'] == ['full', 'no_memory', 'no_gate', 'no_regime']
          assert p['scientific_source']['commit'] == '8172e4085ea98543cb40261b4f9e8bf18da11969'
          expected = {
              'eigen_jepa/benchmark.py': p['scientific_source']['benchmark_py_blob'],
              'eigen_jepa/train.py': p['scientific_source']['train_py_blob'],
              'eigen_jepa/data.py': p['scientific_source']['data_py_blob'],
              'eigen_jepa/utils.py': p['scientific_source']['utils_py_blob'],
              'scripts/check_rigor_gate.py': p['scientific_source']['rigor_gate_blob'],
          }
          ref = p['scientific_source']['commit']
          subprocess.run(['git', 'cat-file', '-e', f'{ref}^{{commit}}'], check=True)
          for path, expected_blob in expected.items():
              blob = subprocess.check_output(['git', 'rev-parse', f'{ref}:{path}'], text=True).strip()
              assert blob == expected_blob, (path, blob, expected_blob)
          print('FROZEN_SOURCE_IDENTITY_PASS')
          PY

      - name: Materialize exact scientific source checkout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eigen-jepa-science
          git worktree add --detach /tmp/eigen-jepa-science 8172e4085ea98543cb40261b4f9e8bf18da11969
          test "$(git -C /tmp/eigen-jepa-science rev-parse HEAD)" = "8172e4085ea98543cb40261b4f9e8bf18da11969"

      - name: Install frozen direct runtime and scientific package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements/final_rigor_v2.txt
          python -m pip install --no-deps -e /tmp/eigen-jepa-science
          python - <<'PY'
          import matplotlib, numpy, torch
          assert numpy.__version__ == '2.4.6', numpy.__version__
          assert torch.__version__.split('+')[0] == '2.13.0', torch.__version__
          assert matplotlib.__version__ == '3.11.1', matplotlib.__version__
          assert not torch.cuda.is_available(), 'v2 is CPU-only'
          print('FROZEN_DIRECT_RUNTIME_PASS')
          PY

      - name: Record pre-run environment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/final_rigor_v2
          {
            echo "control_commit=$GITHUB_SHA"
            echo "scientific_source_commit=8172e4085ea98543cb40261b4f9e8bf18da11969"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "runner_name=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            python -VV
            python -m pip freeze
            python - <<'PY'
          import platform
          import matplotlib
          import numpy
          import torch
          from eigen_jepa.utils import set_seed
          set_seed(7, deterministic=True)
          print('platform', platform.platform())
          print('numpy', numpy.__version__)
          print('torch', torch.__version__)
          print('matplotlib', matplotlib.__version__)
          print('cuda_available', torch.cuda.is_available())
          print('torch_num_threads_after_set_seed', torch.get_num_threads())
          print('torch_num_interop_threads_after_set_seed', torch.get_num_interop_threads())
          PY
          } | tee results/final_rigor_v2/ENVIRONMENT.txt

      - name: Execute exact frozen five-seed x four-variant study
        shell: bash
        run: |
          set -euo pipefail
          python -m eigen_jepa.benchmark --deterministic --device cpu --seeds 7 19 31 43 59 --variants full no_memory no_gate no_regime --num_assets 12 --total_steps 240 --context_len 20 --horizon 6 --num_train 140 --num_val 36 --num_test 36 --k 3 --epochs 8 --batch_size 16 --lr 0.0008 --wd 0.0001 --d_model 64 --n_heads 4 --n_layers 2 --dropout 0.10 --latent_dim 64 --memory_size 128 --memory_top_k 4 --memory_temperature 0.18 --merge_radius 0.16 --min_salience 0.20 --market_style equity --regime_weight 0.75 --gate_weight 0.05 --tail_boost 1.5 --event_quantile 0.70 --mask_ratio 0.25 --block_time 4 --data_source synthetic --eig_weight 1.0 --subspace_weight 2.0 --drift_weight 0.5 --risk_weight 0.25 --entropy_weight 0.15 --rank_weight 0.15 --out_dir results/final_rigor_v2

      - name: Verify exact v2 completion gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_final_rigor_v2.py --metrics results/final_rigor_v2/metrics.json | tee results/final_rigor_v2/GATE.txt

      - name: Retain deterministic evidence ledger and run receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          protocol = Path('protocols/final_rigor_v2_20260905.json')
          metrics = Path('results/final_rigor_v2/metrics.json')
          receipt = {
              'schema_version': 'eigen-jepa.final-rigor-v2-run-receipt.v1',
              'protocol_id': 'eigen-jepa-final-rigor-v2-20260905',
              'control_commit': os.environ['GITHUB_SHA'],
              'scientific_source_commit': '8172e4085ea98543cb40261b4f9e8bf18da11969',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'protocol_sha256': hashlib.sha256(protocol.read_bytes()).hexdigest(),
              'v2_verifier_git_blob': subprocess.check_output(['git', 'hash-object', 'scripts/check_final_rigor_v2.py'], text=True).strip(),
              'aggregate_metrics_sha256': hashlib.sha256(metrics.read_bytes()).hexdigest(),
              'gate_passed': True,
              'seed_list': [7, 19, 31, 43, 59],
              'variants': ['full', 'no_memory', 'no_gate', 'no_regime'],
          }
          Path('results/final_rigor_v2/RUN_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          find results/final_rigor_v2 -type f ! -name CHECKSUMS.sha256 -print0 | sort -z | xargs -0 sha256sum > results/final_rigor_v2/CHECKSUMS.sha256
          cat results/final_rigor_v2/GATE.txt
          cat results/final_rigor_v2/metrics.json

      - name: Upload complete frozen result package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eigen-jepa-final-rigor-v2-20260905
          path: results/final_rigor_v2/
          if-no-files-found: error

      - name: Commit durable JSON evidence to execution branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/final_rigor_v2/metrics.json
          git add results/final_rigor_v2/ENVIRONMENT.txt results/final_rigor_v2/GATE.txt results/final_rigor_v2/RUN_RECEIPT.json results/final_rigor_v2/CHECKSUMS.sha256
          find results/final_rigor_v2 -mindepth 3 -maxdepth 3 -name metrics.json -print0 | xargs -0 git add
          git commit -m "research: retain frozen final-rigor v2 metrics receipt [skip ci]"
          git push origin HEAD:research/final-rigor-v2-run-20260905
