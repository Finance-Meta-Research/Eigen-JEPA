name: Submission claim gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-claim-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source binding
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA" || {
            echo "HEAD mismatch: $actual != $EXPECTED_SOURCE_SHA" >&2
            exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify frozen claim/evidence boundary
        run: python scripts/verify_submission_claim_gate.py
      - name: Run fail-closed regressions
        run: python -m pytest -q tests/test_submission_claim_gate.py
