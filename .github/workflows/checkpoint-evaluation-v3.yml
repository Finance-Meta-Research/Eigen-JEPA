name: Development checkpoint replay

on:
  pull_request:
    paths:
      - 'eigen_jepa/**'
      - 'tests/test_checkpoint_evaluation_v3.py'
      - 'tests/test_cohort_reduction_integrity.py'
      - 'tests/test_covariance_geometry_v3.py'
      - 'tests/test_evaluation_v2.py'
      - '.github/workflows/checkpoint-evaluation-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-checkpoint-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source under test
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU development dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Generated model, policy, CLI, geometry and frozen-source controls
        run: >-
          python -m pytest -q
          tests/test_checkpoint_evaluation_v3.py
          tests/test_covariance_geometry_v3.py
          tests/test_cohort_reduction_integrity.py
          tests/test_evaluation_v2.py
          tests/test_sanity.py
          tests/test_real_market_source_freeze.py
