name: Explicit query-gradient v2 correctness

on:
  pull_request:
    paths:
      - 'eigen_jepa/query_retrieval_v2.py'
      - 'tests/test_query_retrieval_v2.py'
      - 'scripts/demo_query_retrieval_v2.py'
      - '.github/workflows/query-retrieval-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-query-gradient-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source under test
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU development dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Generated derivatives, actual model, checkpoint and inherited controls
        run: >-
          python -m pytest -q -W error tests/test_query_retrieval_v2.py
          tests/test_sanity.py tests/test_checkpoint_evaluation_v3.py
          tests/test_research_evidence_integrity.py
